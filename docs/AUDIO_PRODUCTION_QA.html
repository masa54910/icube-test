<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i CUBE TEST — Production Audio</title>
<style>body{font:16px/1.6 system-ui;color:#142e4b;background:#f5f8fc;max-width:1000px;margin:32px auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:white;border:1px solid #ccd8e7;border-radius:16px;padding:16px}audio{width:100%}button{padding:12px;background:#173b65;color:white;border:0;border-radius:8px}</style>
<h1>i CUBE TEST — Production Audio</h1><p>採用：HOME F / GAMEPLAY D / Correct Scene。第三者音源・Sampleなし。</p>
<p><a href="/">正式音源でゲームを開く</a> · <a href="AUDIO_PRODUCTION_MANIFEST.json">採用元・Seed・SHA-256・容量</a> · <a href="AUDIO_ASSET_RIGHTS.md">制作方法</a></p>
<p>このページは個別確認用です。実ゲームの音量・同期はゲーム内で確認してください。</p><button id="stop">すべて停止</button><div class="grid" id="tracks"></div>
<script type="module">const m=await fetch('AUDIO_PRODUCTION_MANIFEST.json').then(r=>r.json());const players=[];for(const a of m.assets){const card=document.createElement('article'),h=document.createElement('h2'),audio=document.createElement('audio');h.textContent=a.productionFile;audio.src='/assets/audio/'+a.productionFile;audio.controls=true;audio.preload='none';audio.loop=a.kind==='bgm';audio.volume=a.kind==='bgm'?.25:.5;audio.onplay=()=>players.forEach(p=>{if(p!==audio)p.pause()});players.push(audio);card.append(h,audio);document.querySelector('#tracks').append(card)}const stop=()=>players.forEach(a=>a.pause());document.querySelector('#stop').onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});</script></html>
