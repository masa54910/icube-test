<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBE TEST Set A — Geometry / Answer QA</title>
<style>body{font:15px system-ui;color:#16324f;background:#eff4fa;margin:24px}section{background:white;padding:20px;border-radius:16px;margin-block:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}figure{margin:0;border:2px solid #8195ac;background:#edf3fa;border-radius:8px;overflow:hidden}.correct{border-color:#18976a}canvas{display:block;width:100%;aspect-ratio:3/2}figcaption{padding:6px}.canonical{max-width:300px;margin-bottom:12px}@media(max-width:800px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}body{margin:8px}section{padding:12px}}</style>
<h1>CUBE TEST · Set A</h1><p>開発専用。新規5問のCanonicalと実ゲームと同じSeed順の10択。緑枠＝正解。通常ゲームのUIには正解を表示しません。</p><p><a href="CUBE_SCORE_CALIBRATION.html">スコア計算／Synthetic Calibration</a> · <a href="/">ゲーム</a></p><main></main>
<script type="module">
import {TEST_STAGES} from '/src/test-mode/test-stages.ts';import {testChoices} from '/src/test-mode/test-choices.ts';import {baselineFor} from '/src/test-mode/CubeScoreEngine.ts';import {shuffle,buildChoices,shapeKey,normalizeVoxels,isConnected} from '/src/stages/stage-utils.ts';import {drawRouteChoices} from '/src/ui/RouteAnswerPreview.ts';
for(const stage of TEST_STAGES){const choices=shuffle(stage.stageType==='route'?buildChoices(stage):testChoices(stage),stage.numericId),canonical={id:'canonical',correct:true,voxels:normalizeVoxels(stage.memo.canonicalCubes)};
 const section=document.createElement('section'),h=document.createElement('h2');h.textContent=stage.displayName+' · '+stage.subtitle;section.append(h);
 const evidence=document.createElement('pre');evidence.textContent=JSON.stringify({stageId:stage.id,seed:stage.numericId,correctNumber:choices.findIndex(c=>c.correct)+1,exactCanonicalCount:choices.filter(c=>shapeKey(c.voxels)===shapeKey(canonical.voxels)).length,uniqueChoices:new Set(choices.map(c=>shapeKey(c.voxels))).size,faceConnected:isConnected(stage.rooms),...baselineFor(stage),ladders:stage.ladders,answers:stage.answerPoints},null,2);
 const hero=document.createElement('div');hero.className='canonical';const grid=document.createElement('div');grid.className='choices';section.append(hero,grid,evidence);document.querySelector('main').append(section);
 const all=[canonical,...choices],canvases=all.map((c,i)=>{const figure=document.createElement('figure');figure.className=c.correct?'correct':'';const canvas=document.createElement('canvas');canvas.width=300;canvas.height=200;const caption=document.createElement('figcaption');caption.textContent=(i?i:'CANONICAL')+' · '+c.voxels.length+' cubes';figure.append(canvas,caption);(i?grid:hero).append(figure);return canvas;});drawRouteChoices(all,canvases);
}document.body.dataset.ready='true';
</script></html>
