<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTE 1 — PURE ROUTE QA</title><style>body{font:15px system-ui;background:#edf3f8;color:#10243b;margin:24px}section{background:white;border-radius:16px;padding:20px;margin:20px 0}table{border-collapse:collapse}th,td{border:1px solid #aac0d3;padding:8px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}figure{margin:0;background:#1e3248;color:white;border:3px solid #617993;border-radius:10px;overflow:hidden}figure.correct{border-color:#24a369}canvas{display:block;width:100%;aspect-ratio:3/2}figcaption{padding:8px;font-size:12px}.canonical{width:280px}.overview{width:100%;max-width:800px;background:#eff5fa}p{line-height:1.7}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{margin:8px}section{padding:10px}.table{overflow:auto}}</style>
<h1>ADVANCED · ROUTE 1 — PURE ROUTE</h1><p>開発専用QA：緑枠＝正解。Productionには正解表示を追加していません。旧A-1〜A-3はアーカイブ保持。Turnは水平の方向転換のみで、上下移動は別計測です。</p><div class="table"><table><thead><tr><th>Stage</th><th>Cubes</th><th>Turns</th><th>Floors</th><th>Vertical</th><th>Longest</th><th>Answers</th><th>Boosts</th></tr></thead><tbody></tbody></table></div><main></main>
<script type="module">
import {PURE_ROUTE_STAGES,routeAudit} from '/src/stages/pure-route.ts';import {buildRouteChoices} from '/src/stages/route-choices.ts';import {shuffle,normalizeVoxels,shapeKey} from '/src/stages/stage-utils.ts';import {drawRouteChoices} from '/src/ui/RouteAnswerPreview.ts';
window.qaResults=[];
const overviewSection=document.createElement('section');overviewSection.innerHTML='<h2>Geometry Variety v2 — 全10Stage・同一縮尺</h2><p>BOOST：旧3 → 4 Cube（24 world units）。速度・加速・演出は不変。短い直線には配置せず、終端余裕2Cubeを確保。保存済みMemoは消去しませんが、旧形状のメモは再探索して修正してください。</p><div class="grid"></div>';document.querySelector('main').before(overviewSection);
const silhouettes=PURE_ROUTE_STAGES.map(s=>({id:s.id,correct:false,voxels:s.rooms})),overviewCanvases=silhouettes.map((s,i)=>{const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=300;c.height=200;cap.textContent=PURE_ROUTE_STAGES[i].displayName+' '+PURE_ROUTE_STAGES[i].subtitle;f.append(c,cap);overviewSection.querySelector('.grid').append(f);return c});drawRouteChoices(silhouettes,overviewCanvases);
const metrics=document.createElement('p');metrics.textContent=PURE_ROUTE_STAGES.map(s=>{const a=routeAudit(s);return s.displayName+'：XYZ '+a.span.join('×')+' / BOOST '+(s.boostPads.map(b=>b.distance+'Cube').join(', ')||'なし')}).join(' ｜ ');overviewSection.append(metrics);
for(const s of PURE_ROUTE_STAGES){const a=routeAudit(s);const row=document.createElement('tr');row.innerHTML=[s.displayName,a.cubes,a.turns,a.floors,a.vertical,a.longest,a.answers,a.boosts].map(v=>`<td>${v}</td>`).join('');document.querySelector('tbody').append(row);
 const choices=shuffle(buildRouteChoices(s),s.numericId),canonical={id:'canonical',correct:true,voxels:normalizeVoxels(s.memo.canonicalCubes)},all=[canonical,...choices],section=document.createElement('section');section.id='stage-'+s.level;section.innerHTML=`<h2>${s.displayName} · ${s.subtitle}</h2><p>Correct: ${choices.findIndex(c=>c.correct)+1} / Easy 5 · Medium 3 · Similar 1 / Seed ${s.numericId}</p><div class="canonical"></div><div class="grid"></div>`;document.querySelector('main').append(section);
 const canvases=all.map((c,i)=>{const f=document.createElement('figure');f.className=c.correct?'correct':'';const canvas=document.createElement('canvas');canvas.width=300;canvas.height=200;f.append(canvas);const cap=document.createElement('figcaption');cap.textContent=i?`${i} · ${c.voxels.length} cubes · ${c.routeDifficulty} · ${c.mutation}`:'CANONICAL';f.append(cap);section.querySelector(i?'.grid':'.canonical').append(f);return canvas});drawRouteChoices(all,canvases);
 const overview=document.createElement('canvas');overview.className='overview';overview.width=800;overview.height=400;const ctx=overview.getContext('2d'),project=([x,y,z])=>[(x-z)*.85,(x+z)*.38-y*1.4];const points=s.route.main.map(project),xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minX=Math.min(...xs),minY=Math.min(...ys),scale=Math.min(700/(Math.max(...xs)-minX+1),290/(Math.max(...ys)-minY+1)),map=p=>{const [x,y]=project(p);return [50+(x-minX)*scale,50+(y-minY)*scale]};ctx.strokeStyle='#647c96';ctx.lineWidth=3;ctx.beginPath();s.route.main.forEach((p,i)=>{const q=map(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();s.route.main.forEach((p,i)=>{const q=map(p);ctx.fillStyle=['#193451','#437ba5','#72aabd'][p[1]];ctx.fillRect(q[0]-5,q[1]-5,10,10);if(i===0||i===s.route.main.length-1){ctx.fillText(i?'GOAL':'START',q[0]+9,q[1]);}});for(const p of s.answerPoints){const q=map(p);ctx.fillStyle='#139b72';ctx.beginPath();ctx.arc(...q,8,0,Math.PI*2);ctx.fill();ctx.fillText('A',q[0]+10,q[1]);}for(const b of s.boostPads){const q=map(b.position);ctx.fillStyle='#00b9e3';ctx.fillRect(q[0]-9,q[1]-9,18,18);ctx.fillText('BOOST',q[0]+12,q[1]);}for(const l of s.ladders){const q=map(l.to);ctx.strokeStyle='#9355ba';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...map(l.from));ctx.lineTo(...q);ctx.stroke();ctx.fillStyle='#9355ba';ctx.fillText('L',q[0]+10,q[1]);}section.append(overview);const legend=document.createElement('p');legend.textContent='俯瞰：濃淡＝階層 / 緑A＝Answer Point / 紫L＝Ladder / Cyan＝BOOST。床・Cube数を変更する装飾ではなく、QA用マーカーです。';section.append(legend);
 window.qaResults.push({stage:s.id,...a,runs:undefined,correct:choices.findIndex(c=>c.correct)+1,exact:choices.filter(c=>shapeKey(c.voxels)===shapeKey(canonical.voxels)).length,pixelMatch:canvases[0].toDataURL()===canvases[choices.findIndex(c=>c.correct)+1].toDataURL()});
}document.body.dataset.ready='true';
</script></html>
