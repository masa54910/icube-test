<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gameplay Fidelity — Before / After</title>
<style>body{margin:0;padding:24px;background:#081728;color:#e6f2fb;font:16px/1.6 system-ui,sans-serif}main{max-width:1600px;margin:auto}h1{font-size:26px}p{color:#b7cadd}section{margin:32px 0 48px}h2{font-size:19px;color:#7de5f8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;background:#152c42;border:1px solid #426078;border-radius:12px;overflow:hidden}figcaption{padding:10px 16px;font-weight:700}img{display:block;width:100%;height:auto}a{color:#83e5ff}@media(max-width:700px){.pair{grid-template-columns:1fr}body{padding:14px}}</style>
<main><h1>Gameplay Visual Fidelity Upgrade · Phase A</h1><p>左：従来描画 ／ 右：改善後。同一のStage 1-1・キャラクターポーズ・カメラで比較。画像クリックで原寸表示。Home、ゲーム操作、キャラクターの形状・アニメーションは変更していません。</p><div id="comparisons"></div><h2>Home Showcaseとの比較</h2><div class="pair"><figure><figcaption>既存Home Showcase（変更なし）</figcaption><img src="../assets/home-showcase/solve.webp" alt="既存回答端末Showcase"></figure><figure><figcaption>改善後のリアルタイムGameplay</figcaption><img src="gameplay-fidelity-qa/after-terminal.png" alt="改善後回答端末"></figure></div><p>正式なRigged GLBへの置換はPhase B。本ページは描画品質の比較で、完全に同じ人物表現を目指すGateではありません。</p></main>
<script>const items=[['rear','01 キャラクター後方'],['side','02 キャラクター側面'],['ladder','03 梯子'],['terminal','04 回答端末'],['corridor','05 長い通路'],['landing','06 着地ポーズ'],['visor','07 バイザー拡大']];for(const [id,label]of items){const section=document.createElement('section');section.innerHTML=`<h2>${label}</h2><div class="pair">${['before','after'].map(phase=>`<figure><figcaption>${phase==='before'?'BEFORE':'AFTER'}</figcaption><a href="gameplay-fidelity-qa/${phase}-${id}.png"><img loading="lazy" src="gameplay-fidelity-qa/${phase}-${id}.png" alt="${label} ${phase}"></a></figure>`).join('')}</div>`;document.querySelector('#comparisons').append(section);}</script></html>
