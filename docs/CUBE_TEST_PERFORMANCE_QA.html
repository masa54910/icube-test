<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071529" />
    <title>i CUBE TEST</title>
    <style>
      #loading { position:fixed; inset:0; display:grid; place-items:center; margin:0; background:#050b18; color:#86dcff; font:800 16px system-ui,sans-serif; letter-spacing:.08em; text-align:center; padding:24px; }
      #loading.file-warning { display:flex; flex-direction:column; gap:14px; }
      #loading.file-warning small { color:#b6c8d8; font-weight:500; letter-spacing:0; }
    </style>
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script>
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var loading = document.getElementById('loading');
          if (!loading) return;
          loading.className = 'file-warning';
          loading.innerHTML = 'ローカルサーバー経由で起動してください<small>このHTMLを直接開くと、ブラウザのfile://制限でゲームモジュールを読み込めません。<br>同じフォルダーの serve.cmd をダブルクリックし、表示されたURLを開いてください。</small>';
        });
      }
    </script>
    <script type="module" crossorigin src="/dist/assets/game-iSOOwXYR.js"></script>
    <link rel="stylesheet" crossorigin href="/dist/assets/style-CHXScr-r.css">
  </head>
  <body>
    <div id="app" aria-live="polite">
      <canvas id="game-canvas" class="game-canvas" aria-label="i CUBE TEST game canvas"></canvas>
      <div id="ui-root"></div>
      <div id="loading" role="status">LOADING i CUBE TEST…</div>
    </div>
  <pre id="load-report" style="position:fixed;bottom:0;right:0;background:white;color:#123;z-index:999999;font:12px monospace;max-width:420px">Measuring current production bundle (local warm-cache, not before/after comparison)…</pre>
<script type="module">
const report=document.querySelector('#load-report');const start=performance.now();
const poll=()=>{
 const ready=document.querySelector('#loading')?.classList.contains('hidden'),n=performance.getEntriesByType('navigation')[0];
 if(ready&&n.loadEventEnd>0)report.textContent=JSON.stringify({scope:'top-level production bundle; local cache uncontrolled',homeReadyObservedMs:Math.round(performance.now()),domContentLoadedMs:Math.round(n.domContentLoadedEventEnd),loadMs:Math.round(n.loadEventEnd),resourceTransferBytes:performance.getEntriesByType('resource').reduce((s,r)=>s+(r.transferSize||0),0)},null,2);
 else if(performance.now()-start<30000)setTimeout(poll,20);else report.textContent='Readiness timeout';
};poll();
</script></body>
</html>
