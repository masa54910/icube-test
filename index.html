    <style>
      #loading { position:fixed; inset:0; display:grid; place-items:center; margin:0; background:#050b18; color:#86dcff; font:800 16px system-ui,sans-serif; letter-spacing:.08em; text-align:center; padding:24px; }
      #loading.file-warning { display:flex; flex-direction:column; gap:14px; }
      #loading.file-warning small { color:#b6c8d8; font-weight:500; letter-spacing:0; }
    </style>
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script>
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var loading = document.getElementById('loading');
          if (!loading) return;
          loading.className = 'file-warning';
          loading.innerHTML = 'ローカルサーバー経由で起動してください<small>このHTMLを直接開くと、ブラウザのfile://制限でゲームモジュールを読み込めません。<br>同じフォルダーの serve.cmd をダブルクリックし、表示されたURLを開いてください。</small>';
        });
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <canvas id="game-canvas" class="game-canvas" aria-label="i CUBE TEST game canvas"></canvas>
      <div id="ui-root"></div>
      <div id="loading" role="status">LOADING i CUBE TEST…</div>
    </div>
  <script id="mako-kissa-return-script">(() => {
  'use strict';
  const cafe = 'https://mako-game-kissa-study.makoriotto.chatgpt.site/';
  try { if (new URL(document.referrer).origin !== new URL(cafe).origin) return; } catch { return; }
  const mount = () => {
    if (document.getElementById('mako-kissa-return')) return;
    const host = document.createElement('div');
    host.id = 'mako-kissa-return';
    host.style.cssText = 'position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483647;pointer-events:auto;';
    const root = host.attachShadow({mode:'open'});
    const style = document.createElement('style');
    style.textContent = 'a{box-sizing:border-box;display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border:1px solid #ba9367;border-radius:6px;background:#302115ed;color:#ffe5bd;box-shadow:0 2px 8px #0005;font:600 13px/1.3 system-ui,sans-serif;text-decoration:none;white-space:nowrap;touch-action:manipulation}a:hover{background:#64452a}a:focus-visible{outline:3px solid #ffe5bd;outline-offset:3px}';
    const link = document.createElement('a');
    link.href = cafe;
    link.textContent = '喫茶店へ戻る';
    link.addEventListener('click', () => { if (document.pointerLockElement) document.exitPointerLock(); });
    root.append(style, link);document.body.append(host);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, {once:true}); else mount();
})();</script>
</body>
</html>
