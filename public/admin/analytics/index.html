<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>i CUBE TEST · Admin Analytics</title>
<style>body{font:16px system-ui;color:#102f50;background:#f4f8fc;padding:24px}main{max-width:1080px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #1232}h1{margin-top:0}.notice{padding:14px;background:#fff5d8;border:1px solid #e6c96c;border-radius:10px;line-height:1.5}.login{max-width:420px;display:grid;gap:10px}.login input{padding:12px;border:1px solid #b9c9d8;border-radius:8px}.login button,button{padding:10px 16px;border:0;border-radius:8px;background:#123f68;color:white;cursor:pointer}.filters{display:flex;gap:10px;align-items:center;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:16px;border:1px solid #d6e0eb;border-radius:12px;background:#fbfdff}.card b{display:block;font-size:26px;margin-top:6px}.muted{color:#60758a;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e9f0}.hidden{display:none}</style>
<main><h1>i CUBE TEST · Admin Analytics</h1><p id="notice" class="notice">管理者ログインが必要です。Service Role keyはブラウザへ公開しません。</p><form id="login" class="login"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>LOGIN</button></form><section id="dashboard" class="hidden"><div class="filters"><label>期間 <select id="range"><option value="today">Today</option><option value="7d">7 Days</option><option value="30d">30 Days</option><option value="all">All</option></select></label><button id="refresh">Refresh</button><button id="logout">Logout</button></div><section id="cards" class="cards"></section><h2>Stage metrics</h2><table><thead><tr><th>Stage</th><th>Starts</th><th>Completions</th><th>Clear rate</th><th>Avg time</th><th>Hint %</th></tr></thead><tbody id="stages"><tr><td colspan="6" class="muted">No production data yet.</td></tr></tbody></table></section></main>
<script type="module">const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),notice=document.querySelector('#notice'),cards=document.querySelector('#cards'),stages=document.querySelector('#stages');let accessToken=sessionStorage.getItem('icube-admin-token');let config;const labels={players:'Unique players',sessions:'Sessions',gameStarts:'Game starts',completedStages:'Completed stages',averageActiveSeconds:'Avg active seconds',medianActiveSeconds:'Median active seconds',totalActiveSeconds:'Total active seconds',testStarts:'CUBE TEST starts',testCompletes:'CUBE TEST completes'};function showDashboard(){login.classList.add('hidden');dashboard.classList.remove('hidden');refresh()}async function loadConfig(){const r=await fetch('/api/admin/config');if(!r.ok)throw Error('config');config=await r.json()}async function signIn(email,password){await loadConfig();const r=await fetch(`${config.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:config.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok)throw Error('login');const data=await r.json();accessToken=data.access_token;sessionStorage.setItem('icube-admin-token',accessToken);showDashboard()}function render(data){cards.innerHTML=Object.entries(labels).map(([k,v])=>`<article class="card"><span class="muted">${v}</span><b>${data.overview?.[k]??0}</b></article>`).join('');stages.innerHTML=(data.stages??[]).map(s=>`<tr><td>${s.stageId}</td><td>${s.starts}</td><td>${s.completions}</td><td>${s.clearRate??0}%</td><td>${s.averageTime??0}s</td><td>${s.hintPercent??0}%</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No production data yet.</td></tr>';notice.textContent='集計データを表示中（管理者API経由）'}async function refresh(){if(!accessToken)return;const range=document.querySelector('#range').value;const r=await fetch(`/api/admin/analytics?range=${encodeURIComponent(range)}`,{headers:{Authorization:`Bearer ${accessToken}`}});if(r.status===401||r.status===403){sessionStorage.removeItem('icube-admin-token');accessToken='';dashboard.classList.add('hidden');login.classList.remove('hidden');notice.textContent=r.status===403?'管理者権限がありません。':'ログインが必要です。';return}if(!r.ok){notice.textContent='Analytics APIに接続できません。';return}render(await r.json())}login.addEventListener('submit',e=>{e.preventDefault();signIn(document.querySelector('#email').value,document.querySelector('#password').value).catch(()=>{notice.textContent='ログインに失敗しました。'})});document.querySelector('#refresh').onclick=refresh;document.querySelector('#range').onchange=refresh;document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('icube-admin-token');location.reload()};if(accessToken)showDashboard()</script>
