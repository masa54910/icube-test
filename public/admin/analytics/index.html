<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>i CUBE TEST · 管理者アクセス解析</title>
<style>body{font:16px system-ui;color:#102f50;background:#f4f8fc;padding:24px}main{max-width:1080px;margin:auto;background:white;padding:28px;border-radius:16px}.notice{padding:14px;background:#fff5d8;border:1px solid #e6c96c;border-radius:10px}.login{max-width:420px;display:grid;gap:10px}.login input{padding:12px;border:1px solid #b9c9d8;border-radius:8px}.login button,button{padding:10px 16px;border:0;border-radius:8px;background:#123f68;color:white;cursor:pointer}.filters{display:flex;gap:10px;align-items:center;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:16px;border:1px solid #d6e0eb;border-radius:12px;background:#fbfdff}.card b{display:block;font-size:22px;margin-top:6px}.muted{color:#60758a;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:20px;display:block;overflow-x:auto}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e9f0;white-space:nowrap}.hidden{display:none}</style>
<main><h1>i CUBE TEST · 管理者アクセス解析</h1><p id="notice" class="notice">管理者ログインが必要です。</p><form id="login" class="login"><label>メールアドレス<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><section id="dashboard" class="hidden"><div class="filters"><label>期間 <select id="range"><option value="today">今日</option><option value="7d">過去7日</option><option value="30d">過去30日</option><option value="all">全期間</option></select></label><button id="refresh">更新</button><button id="logout">ログアウト</button></div><section id="cards" class="cards"></section><h2>ステージ別データ（離脱分析）</h2><table><thead><tr><th>ステージ</th><th>開始数</th><th>クリア数</th><th>離脱数</th><th>離脱率</th><th>クリア率</th><th>平均クリア時間</th><th>平均離脱時間</th><th>離脱時間中央値</th><th>ヒント率</th><th>Memo率</th></tr></thead><tbody id="stages"><tr><td colspan="11" class="muted">まだ本番プレイデータはありません。</td></tr></tbody></table><h2>CUBE TEST ファネル</h2><div id="funnel" class="cards"></div></section></main>
<script type="module">const $=s=>document.querySelector(s),login=$('#login'),dashboard=$('#dashboard'),notice=$('#notice'),cards=$('#cards'),stages=$('#stages'),funnel=$('#funnel');let accessToken=sessionStorage.getItem('icube-admin-token'),config;const labels={players:'ユニークプレイヤー',sessions:'セッション数',gameStarts:'ゲーム開始数',completedStages:'ステージクリア数',averageActiveSeconds:'平均プレイ時間',medianActiveSeconds:'プレイ時間中央値',totalActiveSeconds:'総プレイ時間',testStarts:'CUBE TEST開始数',testCompletes:'CUBE TEST完走数'};const fs=v=>{const n=Math.max(0,Math.round(Number(v)||0));if(n<60)return `${n}秒`;if(n<3600)return `${Math.floor(n/60)}分${String(n%60).padStart(2,'0')}秒`;return `${Math.floor(n/3600)}時間${Math.floor(n%3600/60)}分${String(n%60).padStart(2,'0')}秒`};const pct=v=>`${Number(v||0).toFixed(1)}%`;async function cfg(){const r=await fetch('/api/admin/config');if(!r.ok)throw Error();config=await r.json()}async function sign(e,p){await cfg();const r=await fetch(`${config.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:config.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});if(!r.ok)throw Error();accessToken=(await r.json()).access_token;sessionStorage.setItem('icube-admin-token',accessToken);show()}function show(){login.classList.add('hidden');dashboard.classList.remove('hidden');refresh()}function render(d){cards.innerHTML=Object.entries(labels).map(([k,v])=>`<article class="card"><span class="muted">${v}</span><b>${k.endsWith('Seconds')?fs(d.overview?.[k]):(d.overview?.[k]??0)}</b></article>`).join('');stages.innerHTML=(d.stages??[]).map(s=>`<tr><td>${s.stageId}</td><td>${s.starts}</td><td>${s.completions}</td><td>${s.abandons??0}</td><td>${pct(s.abandonRate)}</td><td>${pct(s.clearRate)}</td><td>${fs(s.averageTime)}</td><td>${fs(s.averageAbandonTime)}</td><td>${fs(s.medianAbandonTime)}</td><td>${pct(s.hintPercent)}</td><td>${pct(s.memoPercent)}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">まだ本番プレイデータはありません。</td></tr>';const q=d.cubeTest?.questionFunnel??[];const steps=[{n:'開始',c:d.cubeTest?.starts??0},...q.map(x=>({n:`Q${x.question}`,c:x.completes})),{n:'完走',c:d.cubeTest?.completes??0}];funnel.innerHTML=steps.map(x=>`<article class="card"><span class="muted">${x.n}</span><b>${x.c}人</b></article>`).join('');notice.textContent='集計データを表示中（管理者API経由）'}async function refresh(){if(!accessToken)return;const r=await fetch(`/api/admin/analytics?range=${encodeURIComponent($('#range').value)}`,{headers:{Authorization:`Bearer ${accessToken}`}});if(r.status===401||r.status===403){sessionStorage.removeItem('icube-admin-token');location.reload();return}if(!r.ok){notice.textContent='Analytics APIに接続できません。';return}render(await r.json())}login.onsubmit=e=>{e.preventDefault();sign($('#email').value,$('#password').value).catch(()=>notice.textContent='ログインに失敗しました。')};$('#refresh').onclick=refresh;$('#range').onchange=refresh;$('#logout').onclick=()=>{sessionStorage.removeItem('icube-admin-token');location.reload()};if(accessToken)show()</script>
